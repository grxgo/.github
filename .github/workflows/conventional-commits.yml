# Reusable workflow: enforces conventional commits on all PR commits
# (grxgo/.github#9). Repos consume it via a thin caller:
#
#   name: Conventional Commits
#   on:
#     pull_request:
#       types: [opened, edited, synchronize, reopened]
#   jobs:
#     commitlint:
#       # The action reads the PR's commit list via the API; explicit
#       # permissions keep this working regardless of the repo's default
#       # token settings (LeggerLegger#23).
#       permissions:
#         contents: read
#         pull-requests: read
#       uses: grxgo/.github/.github/workflows/conventional-commits.yml@main
#
# Without a commitlint config in the caller repo, the rules of
# @commitlint/config-conventional apply automatically (fix:/feat:/docs:/… +
# BREAKING CHANGE) — exactly the base that semver bumps and changelogs will
# be derived from.
# Named for what it is, not for what it does. The caller next door is also
# called "Conventional Commits" — that is the name that belongs on a check —
# and with both carrying it the Actions list showed the same entry twice and
# read like one of them was left over (grxgo/platform-infra#145). The workflow
# name is not part of the check context: that is built from the job ids,
# `commitlint / commitlint`, so the ruleset on main is unaffected.
name: Conventional Commits (reusable)

on:
  workflow_call: {}

jobs:
  commitlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # commitlint needs the PR commits, not just the merge HEAD
          fetch-depth: 0

      - uses: wagoid/commitlint-github-action@v6
        with:
          helpURL: https://www.conventionalcommits.org/en/v1.0.0/