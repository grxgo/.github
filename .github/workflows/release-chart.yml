# Reusable release workflow for all grxgo repos (grxgo/.github#9, flow
# diagram in docs/release-process.md): conventional commits since the last
# tag determine the next semver version; the image (optional) and the chart
# are pushed to GHCR under that version; only after both pushes succeed the
# commit is tagged and a GitHub release with a grouped changelog and the
# chart archive is created. Failed runs never leave a tag or release behind.
#
# Caller (run from main only, after the repo's test jobs):
#
#   release:
#     if: github.event_name == 'push' && github.ref == 'refs/heads/main'
#     needs: [ build, helm-lint ]
#     permissions:
#       contents: write
#       packages: write
#     uses: grxgo/.github/.github/workflows/release-chart.yml@main
#     with:
#       chart-path: charts/my-service
#       image-name: my-service
#       # Optional, and worth it wherever the build job already compiled the
#       # thing: without it the image build compiles a second time, from a
#       # container that has neither the dependency cache nor the build tool
#       # (platform-infra#145 measured 152 s of 226 s on that alone). The build
#       # job uploads target/*.jar as dist/app.jar under this name, and the
#       # Dockerfile carries a `jar` stage for it.
#       build-artifact: app-jar
name: Release Chart

on:
  workflow_call:
    secrets:
      PACKAGES_READ_TOKEN:
        description: >-
          Org token with read:packages for Dockerfiles whose build stage
          resolves Maven artifacts from GitHub Packages (platform-parent).
          Maven packages are repository-scoped, so the caller's GITHUB_TOKEN
          cannot read them.
        required: false
    inputs:
      chart-path:
        description: Path to the Helm chart directory
        required: true
        type: string
      image-name:
        description: GHCR image name; empty skips the image build
        required: false
        type: string
        default: ''
      sign:
        description: >-
          Sign the published chart and image with cosign (keyless, OIDC).
          Off by default because the CALLER must grant id-token: write — a
          reusable workflow cannot grant it to itself, and turning this on
          without it fails the release. Opt in per repo once the caller has it
          (platform-infra#68).
        type: boolean
        default: false
      app-version-from-release:
        description: >-
          Stamp the chart appVersion with the release version. Disable for
          charts that ship third-party software (their appVersion is the
          upstream version, e.g. Keycloak).
        required: false
        type: boolean
        default: true
      build-artifact:
        description: >-
          Artifact from the caller's build job holding the already-compiled
          application archive. It is downloaded into ./dist and handed to the
          image build as the named context `jar`, which stands in for the
          Dockerfile stage of that name — BuildKit then never runs the compile
          stage behind it. Empty means the image is built from source, which
          costs a second full compile without the caller's dependency cache
          (platform-infra#145).
        required: false
        type: string
        default: ''

env:
  GIT_CLIFF_VERSION: 2.9.1

jobs:
  release:
    runs-on: ubuntu-latest
    # One release at a time per repo: parallel merges queue up instead of
    # racing for the next tag. Never cancelled — every merge must release.
    concurrency:
      group: chart-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          # git-cliff derives the version from tags + full history
          fetch-depth: 0

      - name: Check out shared release config
        uses: actions/checkout@v7
        with:
          repository: grxgo/.github
          path: .release-config

      - name: Install git-cliff
        run: |
          curl -fsSL "https://github.com/orhun/git-cliff/releases/download/v${GIT_CLIFF_VERSION}/git-cliff-${GIT_CLIFF_VERSION}-x86_64-unknown-linux-gnu.tar.gz" -o /tmp/git-cliff.tgz
          tar -xzf /tmp/git-cliff.tgz -C /tmp
          sudo mv "/tmp/git-cliff-${GIT_CLIFF_VERSION}/git-cliff" /usr/local/bin/

      # fix -> patch, feat -> minor, breaking -> major; any other commit type
      # still bumps the patch level, so main never diverges from the latest
      # release. No commits since the last tag (e.g. a re-run) -> skip.
      - name: Compute next version
        id: version
        run: |
          # The highest tag, not the nearest one. git describe walks ancestry,
          # so once a released tag is merged back into main
          # (grxgo/happahabba#88) it returns the older of the two divergent
          # releases and the bump below lands on a version already taken.
          LATEST=$(git tag --list 'v[0-9]*' --sort=-v:refname | head -n1)

          # The range is not optional. Without it git-cliff only weighs the
          # commits on the tag's direct line of descent, and after a PR merge
          # that is the merge commit alone — which cliff.toml skips. The whole
          # PR then goes unnoticed and main silently stops releasing
          # (grxgo/happahabba#83 shipped nothing for exactly this reason).
          # if, not "[ ... ] && ...": the runner's shell is bash -e, where a
          # false AND-list would abort the step on the very first release.
          RANGE=()
          if [ -n "$LATEST" ]; then
            RANGE=("$LATEST..HEAD")
          fi

          TAG=$(git cliff --config .release-config/cliff.toml "${RANGE[@]}" --bumped-version)

          if [ -n "$LATEST" ] && [ -z "$(git log --oneline "$LATEST"..HEAD)" ]; then
            echo "::notice::No commits since $LATEST - skipping release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif git rev-parse -q --verify "refs/tags/$TAG" > /dev/null \
            || [ "$(printf '%s\n%s\n' "$LATEST" "$TAG" | sort -V | tail -n1)" = "$LATEST" ]; then
            # Commits landed, but the computed version is taken or does not
            # move past $LATEST — a branch of nothing but merge commits, say,
            # or a cliff bump measured from a divergent tag. Release anyway at
            # the patch level; a main that keeps drifting from its latest tag
            # is worse than a release with a thin changelog.
            IFS='.' read -r MAJOR MINOR PATCH <<< "${LATEST#v}"
            if [[ "$MAJOR" =~ ^[0-9]+$ && "$MINOR" =~ ^[0-9]+$ && "$PATCH" =~ ^[0-9]+$ ]]; then
              TAG="v${MAJOR}.${MINOR}.$((PATCH + 1))"
              echo "::notice::No bumpable commit since $LATEST - releasing $TAG at the patch level."
              echo "skip=false" >> "$GITHUB_OUTPUT"
            else
              echo "::notice::Cannot derive a patch bump from '$LATEST' - skipping release."
              echo "skip=true" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"
          echo "CHART_NAME=$(basename '${{ inputs.chart-path }}')" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        if: steps.version.outputs.skip == 'false'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # arm64 for the Apple-Silicon k3d nodes; the Dockerfiles pin their build
      # stage to $BUILDPLATFORM, so only the runtime stage is per-platform.
      - name: Set up QEMU
        if: steps.version.outputs.skip == 'false' && inputs.image-name != ''
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.version.outputs.skip == 'false' && inputs.image-name != ''
        uses: docker/setup-buildx-action@v3

      # Same workflow run, so the runtime token is enough — no actions: read
      # on the caller. The name must match what the caller uploaded, and the
      # archive inside must be called app.jar: the Dockerfile's runtime stage
      # copies /app.jar out of the `jar` context, and once that context is a
      # directory the leading slash is this directory's root.
      - name: Fetch the archive the build job already produced
        if: >-
          steps.version.outputs.skip == 'false' && inputs.image-name != ''
          && inputs.build-artifact != ''
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.build-artifact }}
          path: dist

      - name: The archive is where the image build expects it
        if: >-
          steps.version.outputs.skip == 'false' && inputs.image-name != ''
          && inputs.build-artifact != ''
        run: |
          # An empty or misnamed artifact would otherwise surface as a COPY
          # that silently brings nothing, and the image would ship without the
          # application.
          test -s dist/app.jar || {
            echo "::error::artifact '${{ inputs.build-artifact }}' has no dist/app.jar"
            ls -la dist 2>/dev/null || true
            exit 1
          }

      - name: Build and push image
        id: image
        if: steps.version.outputs.skip == 'false' && inputs.image-name != ''
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Records how the image was built and what is in it, so a consumer
          # can check provenance rather than trust the tag.
          provenance: mode=max
          sbom: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ inputs.image-name }}:${{ env.VERSION }}
            ghcr.io/${{ github.repository_owner }}/${{ inputs.image-name }}:sha-${{ github.sha }}
          # Replaces the Dockerfile's `jar` stage with the directory the
          # artifact was unpacked into, so the compile stage behind it never
          # runs. Empty when no artifact was passed — then the Dockerfile
          # builds from source as before.
          build-contexts: ${{ inputs.build-artifact != '' && 'jar=./dist' || '' }}
          cache-from: type=gha
          # mode=max exports every intermediate layer, which for a build stage
          # that compiles is both the expensive half of the export and the
          # half that a source change invalidates anyway. With the archive
          # handed in there is no such stage left to cache.
          cache-to: type=gha,mode=${{ inputs.build-artifact != '' && 'min' || 'max' }}
          # BuildKit secret for Dockerfiles whose build stage resolves Maven
          # artifacts from GitHub Packages (platform-parent); never lands in
          # a layer, unused by Dockerfiles that don't mount it
          secrets: |
            github_token=${{ secrets.PACKAGES_READ_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Install cosign
        if: steps.version.outputs.skip == 'false' && inputs.sign
        uses: sigstore/cosign-installer@v3

      # Keyless: the signature is bound to this workflow's OIDC identity, so a
      # consumer can require that a chart was built by THIS repo's release
      # workflow on main and not merely pushed by someone with packages:write.
      - name: Sign the image
        if: steps.version.outputs.skip == 'false' && inputs.sign && inputs.image-name != ''
        run: |
          cosign sign --yes \
            "ghcr.io/${{ github.repository_owner }}/${{ inputs.image-name }}@${{ steps.image.outputs.digest }}"

      - name: Package and push chart
        if: steps.version.outputs.skip == 'false'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          # Chart metadata contract (platform-infra docs/chart-metadata.md):
          # the commit a chart was built from is stamped at publish, like the
          # version — source and description stay committed in Chart.yaml.
          yq -i '.annotations."org.opencontainers.image.revision" = "${{ github.sha }}"' "${{ inputs.chart-path }}/Chart.yaml"
          helm lint "${{ inputs.chart-path }}"
          if [ "${{ inputs.app-version-from-release }}" = "true" ]; then
            helm package "${{ inputs.chart-path }}" --version "$VERSION" --app-version "$VERSION"
          else
            helm package "${{ inputs.chart-path }}" --version "$VERSION"
          fi
          # Sign by digest, not by tag: a tag can be moved, a digest cannot.
          helm push "$CHART_NAME-$VERSION.tgz" "oci://ghcr.io/${{ github.repository_owner }}/charts" 2>&1 | tee /tmp/helm-push.log
          echo "CHART_DIGEST=$(grep -oE 'sha256:[0-9a-f]{64}' /tmp/helm-push.log | head -1)" >> "$GITHUB_ENV"

      - name: Sign the chart
        if: steps.version.outputs.skip == 'false' && inputs.sign
        run: |
          test -n "$CHART_DIGEST" || { echo "::error::no digest captured from helm push"; exit 1; }
          cosign sign --yes \
            "ghcr.io/${{ github.repository_owner }}/charts/$CHART_NAME@$CHART_DIGEST"

      - name: Generate release notes
        if: steps.version.outputs.skip == 'false'
        run: git cliff --config .release-config/cliff.toml --unreleased --tag "$TAG" --strip header -o /tmp/release-notes.md

      # Tag only now: image and chart are published, so a tag never points to
      # a version that does not exist on GHCR.
      - name: Tag and create GitHub release
        if: steps.version.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"
          gh release create "$TAG" "$CHART_NAME-$VERSION.tgz" --title "$TAG" --notes-file /tmp/release-notes.md
